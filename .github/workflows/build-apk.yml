name: Build NOVA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract NOVA project
        run: |
          unzip -q NOVA_Android_Studio_v0_2.zip -d nova-project
          echo "PROJECT_DIR=nova-project" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Kotlin/Compose compatibility
        working-directory: nova-project
        run: |
          sed -i 's/id("org.jetbrains.kotlin.android") version "2.0.21"/id("org.jetbrains.kotlin.android") version "1.9.25"/' build.gradle.kts

            - name: Configure JVM compatibility
        working-directory: nova-project
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

      - name: Build APK
        working-directory: nova-project
        run: |
          gradle assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: nova-project/app/build/outputs/apk/debug/app-debug.apk
